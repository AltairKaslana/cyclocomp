plugins {
    id 'com.android.application'
}

android {
    namespace 'id.cyclocomp'
    compileSdk 34

    defaultConfig {
        applicationId "id.cyclocomp"
        minSdk 23          // Android 6.0+ (diputuskan 23 Okt 2026)
        targetSdk 33
        versionCode 4
        versionName "0.3.1"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Sengaja TANPA dependency (tanpa AndroidX / Play Services) supaya ringan
// dan jalan di KitKat tanpa Google Play Services.
dependencies {
}
