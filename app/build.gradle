plugins {
    id 'com.android.application'
}

android {
    namespace 'id.cyclocomp'
    compileSdk 34

    defaultConfig {
        applicationId "id.cyclocomp"
        minSdk 23          // Android 6.0+ (diputuskan 23 Okt 2026)
        targetSdk 33
        versionCode 31
        versionName "0.9.18"
    }

    signingConfigs {
        // Keystore TETAP, diambil dari properti Gradle atau variabel lingkungan.
        //
        // Kenapa ini wajib: APK debug ditandatangani ~/.android/debug.keystore yang TIDAK
        // di-cache CI, jadi tiap runner segar menghasilkan sertifikat BARU. Akibatnya
        // memasang versi baru di atas versi lama DITOLAK ("aplikasi sudah terpasang dengan
        // sertifikat berbeda") dan pengguna harus uninstall dulu - data gowes hilang.
        // Dengan keystore tetap, sertifikatnya sama selamanya dan instalasi tumpuk jalan.
        //
        // Keystore TIDAK BOLEH masuk repo (repo ini publik): hanya di GitHub Secrets
        // (CYCLOCOMP_KEYSTORE_BASE64/PASSWORD/ALIAS/KEY_PASSWORD) + salinan lokal
        // /root/.cyclocomp-keystore mode 700.
        //
        // JEBAKAN PKCS12: keystore buatan keytool modern bertipe PKCS12, dan PKCS12
        // TIDAK mendukung password kunci yang berbeda dari password store - keytool
        // memperingatkan "Different store and key passwords not supported ...
        // Ignoring user-specified -keypass value" lalu memakai password store.
        // Akibatnya CYCLOCOMP_KEY_PASSWORD harus diisi password STORE, bukan password
        // kunci terpisah. Kalau diisi yang lain, build gagal di :app:packageRelease
        // dengan UnrecoverableKeyException "Given final block not properly padded" -
        // yang tampak seperti berkas rusak, padahal salah password.
        release {
            def ksPath = System.getenv('CYCLOCOMP_KEYSTORE_PATH')
                ?: (project.findProperty('cyclocompKeystore') as String)
            if (ksPath != null) {
                storeFile file(ksPath)
                storePassword System.getenv('CYCLOCOMP_KEYSTORE_PASSWORD')
                    ?: (project.findProperty('cyclocompStorePassword') as String)
                keyAlias System.getenv('CYCLOCOMP_KEY_ALIAS')
                    ?: (project.findProperty('cyclocompKeyAlias') as String)
                keyPassword System.getenv('CYCLOCOMP_KEY_PASSWORD')
                    ?: (project.findProperty('cyclocompKeyPassword') as String)
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Sengaja TANPA dependency (tanpa AndroidX / Play Services) supaya ringan
// dan jalan di KitKat tanpa Google Play Services.
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
