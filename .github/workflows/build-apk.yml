# Workflow GitHub Actions: build APK debug Cyclocomp.
# Repo ini = root project Gradle (settings.gradle di akar), jadi build langsung di root,
# tidak ada subfolder android/.
# compileSdk 34 -> platforms;android-34 + build-tools;34.0.0
# AGP 8.2.2 -> Gradle 8.2 + JDK 17

name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # JANGAN pakai android-actions/setup-android@v3: ia memanggil `sdkmanager tools`
      # dan paket 'tools' sudah dihapus dari repo SDK. Runner sudah membawa SDK.
      - name: Install SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDKM/sdkmanager" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Show APK info
        run: |
          ls -lh app/build/outputs/apk/debug/
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging app/build/outputs/apk/debug/app-debug.apk | head -6

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cyclocomp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
