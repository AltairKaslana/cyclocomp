# Workflow GitHub Actions: build APK RELEASE Cyclocomp, ditandatangani keystore TETAP.
#
# Kenapa release, bukan debug: APK debug memakai ~/.android/debug.keystore yang tidak
# di-cache CI, jadi tiap runner menghasilkan sertifikat berbeda. Pasang versi baru di
# atas versi lama lalu ditolak ("sertifikat berbeda") dan pengguna harus uninstall -
# data gowes hilang. Keystore tetap membuat sertifikat identik selamanya, sehingga
# instalasi tumpuk jalan.
#
# Keystore TIDAK masuk repo (repo publik). Ia datang dari GitHub Secrets:
#   CYCLOCOMP_KEYSTORE_BASE64 / CYCLOCOMP_KEYSTORE_PASSWORD
#   CYCLOCOMP_KEY_ALIAS / CYCLOCOMP_KEY_PASSWORD
# Salinan lokal: /root/.cyclocomp-keystore (mode 700).
#
# Repo ini = root project Gradle (settings.gradle di akar), build langsung di root.
# compileSdk 34 -> platforms;android-34 + build-tools;34.0.0
# AGP 8.2.2 -> Gradle 8.2 + JDK 17

name: build-apk

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # JANGAN pakai android-actions/setup-android@v3: ia memanggil `sdkmanager tools`
      # dan paket 'tools' sudah dihapus dari repo SDK. Runner sudah membawa SDK.
      - name: Install SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDKM/sdkmanager" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      # Pulihkan keystore dari secret ke berkas sementara, lalu arahkan Gradle ke sana
      # lewat variabel lingkungan yang dibaca signingConfigs.release di app/build.gradle.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CYCLOCOMP_KEYSTORE_BASE64 }}
        run: |
          KS="$RUNNER_TEMP/cyclocomp-release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          echo "CYCLOCOMP_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "CYCLOCOMP_KEYSTORE_PASSWORD=${{ secrets.CYCLOCOMP_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "CYCLOCOMP_KEY_ALIAS=${{ secrets.CYCLOCOMP_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "CYCLOCOMP_KEY_PASSWORD=${{ secrets.CYCLOCOMP_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          ls -l "$KS"

      - name: Build release APK (signed)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Show APK info + certificate fingerprint
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK" | head -6
          echo "--- sidik sertifikat (harus SAMA di semua run) ---"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | grep -i "SHA-256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cyclocomp-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Publikasikan GitHub Release otomatis HANYA saat push tag v*.
      # Build pada push main / workflow_dispatch TIDAK membuat release (aman).
      - name: Publish GitHub Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Zylo ${{ github.ref_name }}
          files: app/build/outputs/apk/release/app-release.apk
