<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perbandingan Logo ZYLO</title>
    <style>
        body {
            background-color: #0E1013;
            color: #FFFFFF;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            display: flex;
            gap: 60px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .option {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 300px;
            padding: 40px;
            background: #1A1D21;
            border-radius: 24px;
            border: 1px solid #2A2F35;
            transition: transform 0.3s ease;
        }
        .option:hover {
            transform: translateY(-10px);
            border-color: #FC4C02;
        }
        .logo-box {
            width: 150px;
            height: 150px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .brand-name {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .desc {
            color: #8A9099;
            font-size: 14px;
            line-height: 1.5;
        }
        .label {
            margin-top: 20px;
            font-size: 12px;
            color: #FC4C02;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <h1 style="margin-bottom: 10px;">Zylo Identity Exploration</h1>
    <p style="color: #8A9099; margin-bottom: 50px;">Membandingkan pendekatan teknis vs simbolik</p>

    <div class="container">
        <!-- Konsep 1: Precision Z -->
        <div class="option">
            <div class="logo-box">
                <svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Top Bar -->
                    <rect x="20" y="25" width="60" height="12" rx="2" fill="#FC4C02"/>
                    <!-- Bottom Bar -->
                    <rect x="20" y="63" width="60" height="12" rx="2" fill="#FC4C02"/>
                    <!-- GradeRoad Diagonal 1 -->
                    <rect x="35" y="37" width="60" height="6" rx="1" fill="#FC4C02" transform="rotate(-42 35 37)"/>
                    <!-- GradeRoad Diagonal 2 -->
                    <rect x="30" y="45" width="60" height="6" rx="1" fill="#FC4C02" transform="rotate(-42 30 45)"/>
                    <!-- GradeRoad Diagonal 3 -->
                    <rect x="25" y="53" width="60" height="6" rx="1" fill="#FC4C02" transform="rotate(-42 25 53)"/>
                </svg>
            </div>
            <div class="brand-name">Zylo</div>
            <div class="desc">Fokus pada presisi data dan DNA GradeRoad. Terasa seperti alat teknis yang akurat.</div>
            <div class="label">Concept 1: Precision Z</div>
        </div>

        <!-- Konsep 3: Zenith Circle -->
        <div class="option">
            <div class="logo-box">
                <svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Main Circle -->
                    <circle cx="50" cy="50" r="38" stroke="#FC4C02" stroke-width="12" />
                    <!-- The Slope Cutout (Masking effect using a white/bg rect) -->
                    <rect x="0" y="55" width="120" height="20" fill="#1A1D21" transform="rotate(-35 50 50)" />
                </svg>
            </div>
            <div class="brand-name">Zylo</div>
            <div class="desc">Simbol roda dan puncak. Simpel, kokoh, dan sangat kuat sebagai ikon aplikasi.</div>
            <div class="label">Concept 3: Zenith Circle</div>
        </div>
    </div>

</body>
</html>
